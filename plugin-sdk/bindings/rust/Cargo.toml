[package]
name = "crescendo-plugin-sdk"
# Tracks the Wasm runtime API this binding set was generated from. Keep it
# equal to `WASM_API_VERSION` and to the `api_version` a plugin declares.
version = "0.2.1"
edition = "2021"
description = "Generated Rust bindings for Crescendo's sandboxed plugin world"
license = "MIT"

# Deliberately outside the Crescendo workspace: this crate only ever builds
# for wasm32-unknown-unknown and is never compiled by the application.
[workspace]

[dependencies]
wit-bindgen = "0.48"
