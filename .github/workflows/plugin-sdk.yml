name: Plugin SDK

on:
  pull_request:
    paths:
      - ".github/workflows/plugin-sdk.yml"
      - "crates/core/**"
      - "plugin-sdk/**"
      - "plugins/**"
      - "crates/core/tests/fixtures/**"
  push:
    paths:
      - ".github/workflows/plugin-sdk.yml"
      - "crates/core/**"
      - "plugin-sdk/**"
      - "plugins/**"
      - "crates/core/tests/fixtures/**"
  release:
    types: [published]

jobs:
  validate-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test package tooling
        run: cargo test -p crescendo-core plugins::tooling
      - name: Validate and pack the official plugin
        run: |
          set -eu
          mkdir -p plugin-artifacts
          source=plugins/dev.crescendo.primary-grouping
          # Read the version from the manifest rather than repeating it here,
          # or a version bump would publish new contents under the old name.
          version=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$source/manifest.json")
          id=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$source/manifest.json")
          package="plugin-artifacts/$id-$version.crescendo-plugin"
          cargo run -p crescendo-core --bin crescendo-plugin -- validate "$source"
          cargo run -p crescendo-core --bin crescendo-plugin -- pack "$source" "$package"
          cargo run -p crescendo-core --bin crescendo-plugin -- validate "$package"
      - name: Check the SDK reports the versions the host implements
        run: |
          set -eu
          api=$(grep -oP 'WASM_API_VERSION: &str = "\K[^"]+' crates/core/src/plugins/mod.rs)
          # Anchor on the package declaration itself. A bare "@$api" match
          # would be satisfied by the world's import lines while the package
          # declaration stayed on the old version.
          check_package() {
            grep -qE "^package $2@$api;\$" "$1" || {
              echo "::error::$1 does not declare $2@$api"
              exit 1
            }
            # And nothing in the file may name a different version of the
            # contract, so an import cannot be left behind either.
            stale=$(grep -oE '@[0-9]+\.[0-9]+\.[0-9]+' "$1" | sort -u | grep -v "^@$api\$" || true)
            if [ -n "$stale" ]; then
              echo "::error::$1 still references $stale, but the runtime API is $api"
              exit 1
            fi
          }
          check_package plugin-sdk/wit/crescendo-plugin.wit crescendo:plugin
          check_package plugin-sdk/wit/deps/crescendo-host.wit crescendo:host
          grep -q "^version = \"$api\"" plugin-sdk/bindings/rust/Cargo.toml || {
            echo "::error::the Rust binding crate version is not $api"
            exit 1
          }
          echo "runtime API $api is consistent across the WIT and the bindings"
      - uses: actions/upload-artifact@v5
        with:
          name: official-crescendo-plugins
          path: plugin-artifacts/*.crescendo-plugin
          if-no-files-found: error

  wasm-fixture-provenance:
    # The committed component is both the demo plugin's artifact and the
    # runtime test fixture. Nothing in cargo can rebuild it (the host has no
    # wasm target), so verify here that it still matches its source.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # This job compares exact bytes, so the tools that produce them are
      # pinned. On a floating toolchain a compiler release would fail
      # provenance with no change to the repository. Raise these deliberately
      # and commit the rebuilt fixture in the same change.
      FIXTURE_RUST: "1.97.1"
      FIXTURE_WASM_TOOLS: "1.258.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FIXTURE_RUST }}
          targets: wasm32-unknown-unknown
      - name: Install wasm-tools
        run: cargo install wasm-tools --version ${{ env.FIXTURE_WASM_TOOLS }} --locked
      - name: Build the published Rust bindings
        # The crate third-party plugins depend on. If it stops compiling
        # against the WIT, every Rust plugin stops compiling.
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path plugin-sdk/bindings/rust/Cargo.toml
      - name: Rebuild the demo component
        run: sh plugins/dev.crescendo.wasm-demo/build.sh
      - name: Compare against the committed fixture
        # Not a raw byte comparison of the two files. Rust bakes a hash of the
        # crate's absolute path into every mangled symbol, so the name section
        # differs between any two checkout locations — this runner's
        # /home/runner/work/... can never equal a contributor's own path, and
        # no toolchain pin fixes that.
        #
        # Everything that executes *is* reproducible, so compare that instead:
        # the component with all custom sections stripped, plus the WIT world
        # as text. Together they cover the code, the structure, and the
        # interface; only unreproducible debug metadata is excluded.
        run: |
          set -eu
          fresh=plugins/dev.crescendo.wasm-demo/module.wasm
          committed=crates/core/tests/fixtures/wasm-demo-module.wasm
          wasm-tools strip --all "$fresh" -o fresh-stripped.wasm
          wasm-tools strip --all "$committed" -o committed-stripped.wasm
          if ! cmp -s fresh-stripped.wasm committed-stripped.wasm; then
            echo "::error::wasm-demo-module.wasm no longer matches its source."
            echo "Rebuild with plugins/dev.crescendo.wasm-demo/build.sh and copy"
            echo "module.wasm to $committed."
            exit 1
          fi
          if ! diff -u <(wasm-tools component wit "$committed") \
                       <(wasm-tools component wit "$fresh"); then
            echo "::error::the committed fixture's WIT world differs from its source."
            exit 1
          fi
          echo "fixture matches its source"
      - name: The frozen 0.2.0 component must never be rebuilt
        # It is the evidence that a component built for an older compatible
        # API still loads. Rebuilding it against today's WIT would make the
        # compatibility test prove nothing.
        run: |
          echo "b7291437863c26ded8da7e9d155e40d08a3de4b572b5c4e9d9aacad0f43d966f  crates/core/tests/fixtures/wasm-legacy-0.2.0-module.wasm" \
            | sha256sum -c -
      - name: Pack the demo package
        run: |
          set -eu
          mkdir -p plugin-artifacts
          manifest=plugins/dev.crescendo.wasm-demo/manifest.json
          version=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$manifest")
          id=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$manifest")
          cargo run -p crescendo-core --bin crescendo-plugin -- \
            pack plugins/dev.crescendo.wasm-demo/dist "plugin-artifacts/$id-$version.crescendo-plugin"
      - uses: actions/upload-artifact@v5
        with:
          name: wasm-demo-plugin
          path: plugin-artifacts/*.crescendo-plugin
          if-no-files-found: error

  publish-release-asset:
    if: github.event_name == 'release'
    needs: [validate-and-pack, wasm-fixture-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: official-crescendo-plugins
          path: plugin-artifacts
      - uses: actions/download-artifact@v5
        with:
          name: wasm-demo-plugin
          path: plugin-artifacts
      - name: Bundle the authoring contract
        # The WIT world and the generated Rust bindings are what a plugin is
        # built against, so they ship with the release that implements them.
        run: tar -czf plugin-artifacts/crescendo-plugin-sdk.tar.gz plugin-sdk
      - name: Attach the official plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            plugin-artifacts/*.crescendo-plugin \
            plugin-artifacts/crescendo-plugin-sdk.tar.gz --clobber

