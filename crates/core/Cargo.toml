[package]
name = "crescendo-core"
version = "0.1.0"
edition = "2021"
description = "Library, scanner, search and metadata core for Crescendo (no UI deps)"

[lib]
name = "crescendo_core"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
lofty = "0.25"
walkdir = "2"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "3", features = ["json"] }
semver = "1"
sha2 = "0.10"
md-5 = "0.10"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
wasmtime = { version = "48", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }
minisign-verify = "0.3"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
env_logger = "0.11"
