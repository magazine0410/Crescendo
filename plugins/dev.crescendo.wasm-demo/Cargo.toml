[package]
name = "crescendo-wasm-demo"
version = "0.2.0"
edition = "2021"
description = "Canonical sandboxed Wasm plugin example for Crescendo"
license = "MIT"

# Deliberately excluded from the Crescendo workspace: this crate only builds
# for the wasm32-unknown-unknown target and is never compiled by the app.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The published binding crate, so this example is built exactly the way a
# third-party plugin is: one shared copy of plugin-sdk/wit, no local
# wit_bindgen::generate! invocation to drift from the host.
crescendo-plugin-sdk = { path = "../../plugin-sdk/bindings/rust" }

[profile.release]
opt-level = "s"
