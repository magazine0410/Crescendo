[package]
name = "crescendo"
version = "0.7.1"
description = "A foobar2000 Eole-style music player"
authors = ["magazine"]
edition = "2021"

[lib]
name = "crescendo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
lofty = "0.25"

[dependencies]
crescendo-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
