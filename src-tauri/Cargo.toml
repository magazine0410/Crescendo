[package]
name = "crescendo"
version = "1.0.3"
description = "A sleek, dark Linux music player"
authors = ["magazine"]
edition = "2021"

[lib]
name = "crescendo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
lofty = "0.25"

[dependencies]
crescendo-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gstreamer = "0.25"
gstreamer-app = "0.25"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"
dirs = "6"
drag = "2.1.1"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
# No "tokio" feature: it makes zbus::blocking call Runtime::block_on, which
# panics inside Tauri's async commands (tauri-plugin-opener's reveal_item_in_dir).
mpris-server = { version = "0.10", features = ["unstable"] }
async-io = "2"
zbus = "5"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gtk = "0.18"
